name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test

      # Local Supabase: migrations, RLS and the public site's content all need it.
      - run: pnpm db:start
      - name: Write .env.local from the local stack
        run: |
          eval "$(pnpm exec supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SITE_URL=https://rashedbin.com"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "EMAIL_PROVIDER=mailpit"
            echo "EMAIL_MODE=live"
            echo "MAILPIT_URL=${MAILPIT_URL:-$INBUCKET_URL}"
            echo "APP_URL=http://localhost:3100"
            echo "IP_HASH_SALT=ci-only-salt"
            echo "CRON_SECRET=local-cron-secret-0123456789"
          } > .env.local
      - name: Generated database types are up to date
        run: |
          pnpm exec supabase gen types typescript --local > /tmp/types.ts
          pnpm exec prettier --stdin-filepath src/server/db/types.ts < /tmp/types.ts > /tmp/types.formatted.ts
          diff -u src/server/db/types.ts /tmp/types.formatted.ts
      - run: pnpm typecheck
      - run: pnpm test:db
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
