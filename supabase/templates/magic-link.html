<!doctype html>
<html>
  <body
    style="
      margin: 0;
      padding: 32px 16px;
      background: #f6f5f1;
      font-family: Helvetica, Arial, sans-serif;
      color: #0b0b0b;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            style="max-width: 480px; background: #ffffff; border-radius: 20px; padding: 32px"
            cellpadding="0"
            cellspacing="0"
          >
            <tr>
              <td style="font-size: 18px; font-weight: 600">Rashed</td>
            </tr>
            <tr>
              <td style="padding-top: 24px; font-size: 16px; line-height: 1.6">
                Use this code to sign in to your client area:
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 20px 0;
                  font-size: 32px;
                  letter-spacing: 8px;
                  font-family: Menlo, Consolas, monospace;
                  font-weight: 600;
                "
              >
                {{ .Token }}
              </td>
            </tr>
            <tr>
              <td style="font-size: 14px; line-height: 1.6; color: #3a3a38">
                The code expires shortly and can be used once. If you didn't try to sign in, you can
                ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
